project_id = "kortex"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "kortex://"
additional_redirect_urls = ["kortex://**", "exp://127.0.0.1:8081/**"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.interpret-capture]
verify_jwt = true

[functions.transcribe-capture]
verify_jwt = true

[functions.ask-kortex]
verify_jwt = true
